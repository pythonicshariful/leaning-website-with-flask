{% extends "base.html" %}
{% block title %}স্টুডেন্ট প্রোফাইল — পড়ারঘর{% endblock %}
{% block content %}
<div class="container profile-page">
  <div class="profile-card">
    <div class="profile-card__heading">
      <p class="eyebrow">আপনার অ্যাকাউন্ট</p>
      <h1>প্রোফাইল তথ্য</h1>
      <p>আপনার যোগাযোগের তথ্য আপডেট রাখুন, যাতে প্রয়োজন হলে আমরা সহায়তা করতে পারি।</p>
    </div>

    <form method="post" class="profile-form">
      <div class="profile-form__grid">
        <div class="form-group">
          <label for="name">আপনার নাম</label>
          <input class="form-input" id="name" name="name" value="{{ student.name or '' }}" autocomplete="name" required>
        </div>
        <div class="form-group">
          <label for="phone">মোবাইল নম্বর</label>
          <input class="form-input" id="phone" name="phone" type="tel" value="{{ student.phone or '' }}" autocomplete="tel" inputmode="tel" required>
        </div>
        <div class="form-group profile-form__wide">
          <label for="email">ইমেইল</label>
          <input class="form-input" id="email" name="email" type="email" value="{{ student.email or '' }}" autocomplete="email" placeholder="example@mail.com">
        </div>
        <div class="form-group profile-form__wide">
          <label for="photo">প্রোফাইল লিংক / URL</label>
          <input class="form-input" id="photo" name="photo" type="url" value="{{ student.photo or '' }}" placeholder="https://...">
        </div>
      </div>

      <div class="profile-form__actions">
        <a href="{{ url_for('student_dashboard') }}" class="btn-secondary">ড্যাশবোর্ডে ফিরুন</a>
        <button class="btn-cta" type="submit">পরিবর্তন সেভ করুন</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
