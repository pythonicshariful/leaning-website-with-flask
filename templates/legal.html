{% extends "base.html" %}
{% block title %}{{ title }} — {{ settings.brand_name }}{% endblock %}
{% block content %}
<div class="container" style="padding-top: 50px; padding-bottom: 70px; max-width: 800px;">
  <div style="background: #ffffff; border: 1px solid #e2e8f0; border-radius: 20px; padding: 40px; box-shadow: var(--shadow-sm);">
    <h1 style="font-size: 32px; font-weight: 800; margin-bottom: 20px; color: #0f172a;">{{ title }}</h1>
    <div style="font-size: 16px; line-height: 1.8; color: #334155;">
      {{ content|safe }}
    </div>
  </div>
</div>
{% endblock %}
