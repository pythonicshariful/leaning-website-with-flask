{% extends "base.html" %}
{% block title %}সাইন ইন / লগইন — পড়ারঘর{% endblock %}
{% block content %}
<div class="container auth-page">
  <div class="auth-box">
    <div class="auth-box__intro">
      <div class="auth-box__icon" aria-hidden="true">
        <svg width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
      </div>
      <h1>শিক্ষার্থী লগইন</h1>
      <p>আপনার মোবাইল নম্বর দিয়ে ড্যাশবোর্ডে প্রবেশ করুন</p>
    </div>

    <form method="post">
      <input type="hidden" name="next" value="{{ next_url }}">
      <div class="form-group">
        <label for="phone">মোবাইল নম্বর</label>
        <input class="form-input" id="phone" name="phone" type="tel" autocomplete="tel" inputmode="tel" placeholder="০১XXXXXXXXX" required>
      </div>
      <div class="form-group">
        <label for="name">আপনার নাম (ঐচ্ছিক)</label>
        <input class="form-input" id="name" name="name" autocomplete="name" placeholder="যেমন: তানভীর আহমেদ">
      </div>
      <button class="btn-cta auth-submit" type="submit">
        <span>লগইন করুন</span>
        <svg aria-hidden="true" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg>
      </button>
    </form>

    <div class="auth-box__note">
      কোনো অ্যাকাউন্ট তৈরি করা লাগবে না, সরাসরি ফোন নম্বর দিয়েই লগইন সম্পন্ন হবে।
    </div>
  </div>
</div>
{% endblock %}
